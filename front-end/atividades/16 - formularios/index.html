<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<body>
    <header class="p-3 text-center bg-light">
        <h1>Formulários</h1>
    </header>


    <main class="container">
        <section class="row">
<div class="col-12 col-md-6">
    <h2>Formulário de Cadastro</h2>
        <form class="d-flex flex-column gap-2 rounded-3 p-3 bg-light">
            <label for="nome">Nome: </label>
            <input id="Nome" type="text" maxlength="30" placeholder="Digite seu nome...">
            <label for="telefone">Telefone: </label>
            <input type="text" maxlength="15" placeholder="(xx) xxxxx-xxxx">
            <!-- label é o formulario, imput é oq ta dentro do formulario -->
            <label for="estado">Selecione o Estado: </label>
            <select name="estado" id="estado">
                <option value="">RS</option>
                <option value="">SC</option>
                <option value="">MT</option>
                <option value="">RJ</option>
            </select>

            <label for="dataNasc">Data de Nascimento: </label>
            <input id="dataNasc" type="date" placeholder="dd/mm/aaaa" max="2025-05-14">
            <!-- type = date - para fazer o calendario para escolher a data de nascimento -->

            <label>Informar o Sexo: </label>
            <div>
                <input type="radio" name="sex" id="">Masculino
                <input type="radio" name="sex" id="">Feminino
            </div>

            <label for="">Selecione as Disciplinas: </label>
            <div>
                <p><input type="checkbox" name="disc" id="">Front-End</p>
                <p><input type="checkbox" name="disc" id="">Back-End</p>
                <p><input type="checkbox" name="disc" id="">Lógica de Programação</p>
                <p><input type="checkbox" name="disc" id="">Malabarismo com Facas</p>
            </div>

            <button type="submit"Salvar></button>
            <button type="reset"Cancelar></button>
            </div>

            
            <div class="col-12 col-md-6">
                <h2>Formulário de Login</h2>
            <form action="/action_page.php">
                <div class="mb-3 mt-3">
                  <label for="email" class="form-label">Email:</label>
                  <input type="email" class="form-control" id="email" placeholder="Seu email..." name="email">
                </div>
                <div class="mb-3">
                  <label for="pwd" class="form-label">Senha:</label>
                  <input type="password" class="form-control" id="pwd" placeholder="Sua Senha..." name="pswd">
                </div>
              <div class="form-check mb-3">
                  <label class="form-check-label">
                    <input class="form-check-input" type="checkbox" name="remember"> Lembrar me
                  </label>
                </div>
                <button type="submit" class="btn btn-primary">Submit</button>
              </form>
            </div>
            <section>


            
            <!-- maxlenght é o max de algaritimos que a pessoa pode digitar -->
            <!-- placeholder é oq fica escrito dentro da caixa de forma mais apagada -->
            <!-- select é para escolher opçoes  -->
            
        </form>
    </main>



</body>

</html>
