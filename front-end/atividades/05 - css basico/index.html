<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introdução ao CSS</title>
    <link rel="stylesheet" href="style.css">
    <!-- criar novo arquivo com o nome style.css para colocar o css no programa -->
    <!-- colocar em baixo do title a palavra link e ao lado de href o código style.css para introduzir o css -->

    <style>
        li{
            font-style: italic;
            text-decoration: underline;
            font-size: 20;
        }
        body{
            background-color: burlywood;
        }

    </style>
    <!-- dentro do style voce pode mudar a fonte/cor de todas as palavras e todas as partes da pagina da maneira como esta ali em cima -->
</head>
<body>
    <h1 style="font-size: 60px;">Introdução ao CSS</h1>
    <h2 class="borda-5">Formas de Uso</h2>
    <ul>
        <li>Em Linha</li>
        <li>Interno</li>
        <li>Externo</li>
    </ul>
    <h2>Seletores</h2>
    <ul>
        <li>Pelo nome da tag</li>   
        <li id="item-2">Nome do id</li>
        <li>Nome da classe</li>
    </ul>
</body>
</html>
