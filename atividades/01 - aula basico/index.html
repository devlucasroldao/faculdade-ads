<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introdução ao HTML</title>
</head>

<body>
    <h1>Introdução ao HTML</h1>
    <P>Meu primeiro site HTML</P>
    <hr>
    <h2>Atributo de Estilo
        <p style="background-color: rgba(255, 0, 0, 0.788);">Cor de fundo</p>
        <p style="color: chartreuse;">Cor de Texto
        <p style="border: 2px solid yellowgreen;">Estilizando Bordas
    <hr>
    <!-- Tag h2 -->
    <h2>Elementos de Formatação</h2>
    <p> Texto em <Strong> negrito </Strong></p>
    <p> Texto em <em> Itálico</em></p>
    <!-- Meus comentários
    <!-- Tag stong utilizar no lugar da tag b para negrito
    segurar a tecla Ctrl e apertar a tecla ; cria a tag automáticamente-->
    <hr>
    <h2> Listas</h2>
    <h3> Listas não ordenadas </h3>
    <ul>
        <li> Item 1 </li>
        <li> Item 2 </li>
        <li> Item 3 </li>
    </ul>
    <h3> Lista ordenadas </h3>
    <ul>
        <ol> Item 1 </ol>
        <ol> Item 2 </ol>
        <ol> Item 3 </ol>
    </ul>
</body>

</html>
